---
# yamllint disable rule:line-length rule:truthy
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      - name: Run unittest suite
        run: just test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      - name: Build and validate package metadata
        run: |
          just build
          just check-dist
      # `twine check` reads metadata and never opens the archive, so it passes
      # on a wheel that is missing a module entirely. Installing and importing
      # is the only thing that catches that.
      - name: Prove the public surface imports from the installed wheel
        run: just check-install

  # Amber admission gates on the exact deployed Hermes fork contract. Keep the
  # immutable revision aligned with infra's candidate image/source receipt.
  # Amber admission gates on the exact deployed Hermes fork contract. The pin
  # below is test-enforced against hermes_plugin_kit.testing's constant; the
  # workflow cannot read that constant, because actions/checkout consumes the
  # ref before setup-uv installs Python.
  hermes-deployed-contract:
    runs-on: ubuntu-latest
    env:
      DEPLOYED_HERMES_REVISION: f80f453ae0679347e38abc917c7f94f717bf96c5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: NousResearch/hermes-agent
          ref: f80f453ae0679347e38abc917c7f94f717bf96c5
          path: .hermes-agent-deployed
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      # The full suite, not the context-engine module alone. It is green at
      # this pin, so widening adds coverage rather than risk.
      - name: Run the full contract suite against the deployed Hermes revision
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/.hermes-agent-deployed
        run: |
          test "$(git -C "$HERMES_AGENT_PATH" rev-parse HEAD)" = \
            "$DEPLOYED_HERMES_REVISION"
          just test-contract-pinned
